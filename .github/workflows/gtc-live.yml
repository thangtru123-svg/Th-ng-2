name: GTC Live (TBB)
on:
  workflow_dispatch:
concurrency:
  group: gtc-live
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pull GTC realtime
        env:
          GHN_SESSION: ${{ secrets.GHN_SESSION }}
        run: node scripts/pull_gtc.js
      - name: Commit data
        run: |
          git config user.name "gtc-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gtc_live.json gtc_history.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi"
          else
            git commit -m "data(tbb): GTC live $(date -u +'%Y-%m-%d %H:%M')Z"
            git push
          fi
